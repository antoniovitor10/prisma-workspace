version: "1.0"
description: "Indice deterministico de contexto por dominio para runrun-copia"

authority_hierarchy:
  - "1. Usuário Humano (PO)"
  - "2. AGENTS.md / DECISIONS.md / ROADMAP.md"
  - "3. Histórias de usuário em stories/"
  - "4. Especificações em specs/*.md (status: approved)"
  - "5. Grafo de Workflow (workflows/feature.yaml) e Perfil de Execução (profiles/runrun-loop.yaml)"
  - "6. Agent Contracts (agents/*.yaml) e saídas do loop engine"

story_catalog: "stories/catalog.json"

exclusions:
  - "**/node_modules/**"
  - "**/bin/**"
  - "**/obj/**"
  - "**/.git/**"
  - "**/.agent-state/**"
  - "**/*.env*"
  - "**/*.dll"
  - "**/*.exe"
  - "**/*.pdb"

domains:
  organizations:
    spec: "specs/organizations.md"
    code:
      - "src/Prisma.Workspace.Domain/Entities/Organization.cs"
