name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Prisma.Workspace.sln
      - name: Build
        run: dotnet build Prisma.Workspace.sln --configuration Release --no-restore
      # Decisão do mantenedor: build automático; testes backend sob demanda.

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Prisma.Workspace.Web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Prisma.Workspace.Web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --pool=threads --maxWorkers=1 --fileParallelism=false
      - name: Build
        run: npm run build
      - name: Reject critical npm advisories
        run: npm audit --audit-level=critical

  context-explorer:
    name: Context governance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/context-explorer
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Test context model
        run: npm test

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test deployment guards
        run: python3 -m unittest discover -s scripts/tests
      - name: Test CLI bridge isolation and authentication
        run: python3 infra/ai-bridge/test_bridge.py
      - name: Build image
        run: docker build --label org.opencontainers.image.revision=${{ github.sha }} --tag prisma-workspace:${{ github.sha }} .
      - name: Export candidate
        run: |
          mkdir -p image
          docker save prisma-workspace:${{ github.sha }} | gzip -n > image/prisma-image.tar.gz
          cd image
          sha256sum prisma-image.tar.gz > prisma-image.sha256
          python3 ../scripts/deployment-manifest.py > migrations.json
      - name: Store candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prisma-image-${{ github.sha }}
          path: image/
          compression-level: 0
          retention-days: 3

  e2e:
    name: E2E (SQL Server, desktop e mobile)
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prisma-image-${{ github.sha }}
          path: image/
      - name: Validate and load candidate
        run: |
          cd image
          sha256sum --check prisma-image.sha256
          docker load --input prisma-image.tar.gz
      - name: Test candidate
        run: bash scripts/ci-e2e.sh prisma-workspace:${{ github.sha }}

  deploy:
    name: Deploy produção
    needs: [backend, frontend, context-explorer, container, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://prisma.nordevs.com.br
    concurrency:
      group: prisma-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prisma-image-${{ github.sha }}
          path: image/
      - name: Publish candidate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/prisma-deploy
          chmod 600 ~/.ssh/prisma-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote="/home/dev/prisma-deploy/incoming/$DEPLOY_SHA"
          ssh -i ~/.ssh/prisma-deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "mkdir -p '$remote' && chmod 700 '$remote'"
          scp -i ~/.ssh/prisma-deploy -o BatchMode=yes -o StrictHostKeyChecking=yes image/* scripts/deploy-production.py "$target:$remote/"
          ssh -i ~/.ssh/prisma-deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "python3 '$remote/deploy-production.py' '$DEPLOY_SHA'"
