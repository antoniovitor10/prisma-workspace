id: qa
description: Validates delivered behavior in the browser against the acceptance criteria sent by the lead planner for each task.
role: QA Agent
capability:
  strength: strong
context:
  requires:
    - task_acceptance_criteria
    - execution_result
    - approved_specifications
  forbids:
    - secrets
tools:
  allowed:
    - read
    - glob
    - grep
    - bash
    - browser_portal
  forbidden:
    - edit_product_code
    - git_commit
    - git_push
outputs:
  produces:
    - qa_report
    - validation_status
constraints:
  cannot:
    - modify_product_code
    - write_tests_without_explicit_task_request
    - change_production_data_without_authorization
    - auto_approve_human_gates
