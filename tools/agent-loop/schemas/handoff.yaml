$schema: http://json-schema.org/draft-07/schema#
title: Handoff
type: object
description: Schema for structured state handoff between agents. Chain-of-thought and secrets are explicitly forbidden from storage.
required:
  - handoff_id
  - task_id
  - source_agent
  - target_agent
  - timestamp
  - payload
  - human_gates
properties:
  handoff_id:
    type: string
    description: Unique identifier for the handoff.
  task_id:
    type: string
    description: Identifier of the task being handed off.
  source_agent:
    type: string
    description: ID of transferring agent.
  target_agent:
    type: string
    description: ID of receiving agent.
  timestamp:
    type: string
    format: date-time
  payload:
    type: object
    description: Context and artifacts passed to target agent.
  human_gates:
    type: array
    description: Active or resolved human gates associated with handoff.
    items:
      type: object
      required:
        - type
        - reason
        - status
        - requested_at
      properties:
        type:
          type: string
        reason:
          type: string
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        requested_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        resolved_by:
          type: string
        note:
          type: string
      additionalProperties: false
additionalProperties: true
forbidden_storage:
  - chain_of_thought
  - secrets
