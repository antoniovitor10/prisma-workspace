$schema: http://json-schema.org/draft-07/schema#
title: TaskEnvelope
type: object
description: Schema for agent task execution state and envelope data. Chain-of-thought and secrets are explicitly forbidden from storage.
required:
  - task_id
  - spec_id
  - status
  - created_at
  - updated_at
  - human_gates
properties:
  task_id:
    type: string
    description: Unique task identifier.
  spec_id:
    type: string
    description: Reference to approved specification ID.
  status:
    type: string
    enum:
      - pending
      - in_progress
      - paused
      - completed
      - failed
      - cancelled
  current_agent:
    type: string
    description: ID of current agent assigned to the task.
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  human_gates:
    type: array
    description: List of human gates governing task state transitions.
    items:
      type: object
      required:
        - type
        - reason
        - status
        - requested_at
      properties:
        type:
          type: string
          description: Gate type (e.g. G-SPEC, G-MIGRATION, G-WORKFLOW, G-HISTORY, G-DEPLOY, G-SCOPE).
        reason:
          type: string
          description: Trigger reason for the human gate.
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        requested_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        resolved_by:
          type: string
          description: Identifier of person who resolved the gate.
        note:
          type: string
          description: Notes or decisions recorded upon gate resolution.
      additionalProperties: false
additionalProperties: true
forbidden_storage:
  - chain_of_thought
  - secrets
