# Ambientes exclusivos do servidor; scripts limitam os projetos a prisma-dev/prisma-qa.
services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Execute scripts/setup-e2e-database.sh}"
    ports:
      - "127.0.0.1:${PRISMA_SQL_PORT:-3102}:1433"
    volumes:
      - database:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${PRISMA_SERVER_IMAGE:-prisma-dev-app:local}"
    network_mode: host
    depends_on:
      database:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://0.0.0.0:${PRISMA_HTTP_PORT:-3100}"
      ConnectionStrings__DefaultConnection: "Server=127.0.0.1,${PRISMA_SQL_PORT:-3102};Database=${PRISMA_DB_NAME:-DetranKanban_E2E};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Key: "${PRISMA_JWT_KEY:?Execute scripts/setup-e2e-database.sh}"
      Seed__DemoEnabled: "true"
      Seed__DemoPassword: "${E2E_TEST_USER_PASSWORD:?Execute scripts/setup-e2e-database.sh}"
      Setup__Enabled: "false"
      RateLimiting__GlobalPermitLimit: "10000"
      RateLimiting__AuthPermitLimit: "10000"
      Serilog__MinimumLevel__Default: Warning
      Serilog__MinimumLevel__Override__Microsoft: Warning
      Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore.Database.Command: Warning
      FrontendBaseUrl: "http://localhost:${PRISMA_HTTP_PORT:-3100}"
      Ai__BridgeToken: "${PRISMA_AI_BRIDGE_TOKEN:?Execute scripts/setup-e2e-database.sh}"
      Ai__BridgeUrl: "${PRISMA_AI_BRIDGE_URL:-http://127.0.0.1:3103/v1}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:${PRISMA_HTTP_PORT:-3100}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - attachments:/app/App_Data
      - keys:/root/.aspnet/DataProtection-Keys
volumes:
  database:
  attachments:
  keys:
